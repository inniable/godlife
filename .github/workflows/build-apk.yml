name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build:export

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Generate Release Keystore and Build Signed APK
        run: |
          cd android
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore upload-keystore.p12 \
            -alias goalmate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass goalmate123 \
            -keypass goalmate123 \
            -dname "CN=GoalMate, OU=Mobile, O=GoalMate, L=Seoul, S=Seoul, C=KR"
          printf "storeFile=upload-keystore.p12\nstorePassword=goalmate123\nkeyAlias=goalmate\nkeyPassword=goalmate123\n" > keystore.properties
          
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/GoalMate-Android.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalMate-Android-APK
          path: GoalMate-Android.apk
          retention-days: 14

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "갓생살기(GoalMate) Android 정식 서명 최신 APK"
          body: "스마트폰에서 `GoalMate-Android.apk` 파일을 다운로드받아 바로 설치하세요 (정식 서명 완료)."
          files: GoalMate-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
