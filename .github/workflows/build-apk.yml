name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build:export

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon || ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/GoalMate-Android.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalMate-Android-Debug-APK
          path: GoalMate-Android.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "갓생살기(GoalMate) Android 최신 APK"
          body: "스마트폰에서 `GoalMate-Android.apk` 파일을 다운로드받아 바로 설치하세요."
          files: GoalMate-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
