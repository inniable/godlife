<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#7C3AED"/>
      <stop offset="75%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Ambient Top-light Glow -->
    <radialGradient id="topGlow" cx="35%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Sparkle Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>

    <!-- Checkmark & Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Drop Shadow for Main Emblem -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>

    <!-- Subtle Inner Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle lighting overlay -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#topGlow)"/>

  <!-- Delicate inner rim highlight -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.28"/>

  <!-- Radiant Morning Sun / Energy Orb -->
  <circle cx="366" cy="142" r="32" fill="url(#sunGlow)" filter="url(#dropShadow)"/>
  <circle cx="366" cy="142" r="18" fill="#FEF08A" opacity="0.9"/>
  <!-- Mini energy sparks around sun -->
  <circle cx="396" cy="116" r="6" fill="#FDE047" opacity="0.8"/>
  <circle cx="334" cy="172" r="4.5" fill="#FDE047" opacity="0.8"/>

  <!-- Main Goal & Spark Emblem (Checkmark + Starburst) -->
  <g filter="url(#dropShadow)">
    <!-- Central Bold Radiant Star (갓생의 빛) -->
    <path d="M 230 110 
             Q 234 182 284 218 
             Q 234 254 230 326 
             Q 226 254 176 218 
             Q 226 182 230 110 Z" 
          fill="url(#starGrad)" />

    <!-- Dynamic Flowing Checkmark (목표 달성) -->
    <path d="M 132 284 
             C 146 270 170 270 184 284 
             L 220 320 
             C 226 326 236 326 242 320 
             L 374 184 
             C 388 170 412 170 426 184 
             C 440 198 440 222 426 236 
             L 260 404 
             C 244 420 218 420 202 404 
             L 132 334 
             C 118 320 118 298 132 284 Z" 
          fill="url(#starGrad)" />
  </g>

  <!-- Accent Sparkle (Top-Left Small Star) -->
  <path d="M 126 150 Q 128 168 144 176 Q 128 184 126 202 Q 124 184 108 176 Q 124 168 126 150 Z" 
        fill="#FFFFFF" opacity="0.85" filter="url(#dropShadow)"/>

  <!-- Bottom Reflection / Horizon Accent Line -->
  <ellipse cx="256" cy="454" rx="140" ry="12" fill="#FFFFFF" opacity="0.12"/>
</svg>